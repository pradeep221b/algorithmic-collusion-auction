[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "collusim"
version = "0.1.0"
description = "Independent Q-learners in a uniform-price electricity auction, and the tests that separate tacit collusion from merely high prices"
readme = "README.md"
license = "MIT"
authors = [{ name = "Pradeep Sriramula" }]
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "numba>=0.60"]
keywords = ["algorithmic collusion", "q-learning", "electricity market", "uniform-price auction", "multi-agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]      # experiments.py, indicators.py, phase1.py fig
test = ["pytest>=8"]

[project.urls]
Repository = "https://github.com/pradeep221b/algorithmic-collusion-auction"
Results = "https://github.com/pradeep221b/algorithmic-collusion-auction/blob/main/RESULTS.md"

[tool.setuptools]
packages = ["collusim"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
