[project]
name = "algorithmic-collusion-auction"
version = "0.1.0"
description = "Independent Q-learners in a uniform-price electricity auction: do they tacitly collude?"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "numba>=0.60", "matplotlib>=3.8"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
